name: Unified CI/CD Pipeline

on:
  push:
    branches:
      - main
      - phase2-sprint*
  pull_request:
    branches:
      - main
      - phase2-sprint*
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  issues: write

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: dir . --verbose --redact

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend & Generate SBOM
        run: mvn clean install

      - name: Run backend tests
        run: mvn test

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json

  # Parallel Security & Quality Jobs
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Checkstyle & SpotBugs
        run: mvn checkstyle:check spotbugs:check

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: SCA (OWASP Dependency Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Cache OWASP DB
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: owasp-db-${{ runner.os }}
      - name: Run Dependency Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -DossindexAnalyzerEnabled=false \
            -DdataDirectory=~/.dependency-check \
            -Dformat=ALL \
            -DfailBuildOnCVSS=7.0
      - name: Upload Reports
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif

  trivy:
    name: Trivy (FS Scan)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Populate Maven Cache
        run: mvn dependency:resolve
      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,config'
          trivy-config: '' 
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  mutation-testing:
    name: PIT Mutation
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run PIT
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports

  runtime-testing:
    name: Runtime API & Security Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Install Newman
        run: npm install -g newman
      - name: Build JAR
        run: mvn package -DskipTests
      - name: Run Application
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Wait for App Readiness
        run: |
          for i in {1..20}; do
            curl -s http://localhost:9393/api/health && echo "App is ready!" && break || (echo "Waiting..." && sleep 5)
          done
      - name: Run Postman Collection (Newman)
        run: |
          newman run Deliverables/Sprint2-Phase2.postman_collection.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:9393'
          fail_action: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-reports
          path: |
            newman-report.xml
            report_html.html
            app.log

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-quality, sast, sca, trivy, mutation-testing, runtime-testing]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
