spring.application.name=LearningMore
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/learningmore
spring.datasource.username=learningmore
spring.datasource.password=learningmore
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=9393
# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita warning open-in-view
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-environment
jwt.expiration=86400000
